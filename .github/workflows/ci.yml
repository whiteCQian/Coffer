name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
      MINIO_ACCESS_KEY: ci-minio-user
      MINIO_SECRET_KEY: ci-minio-password-for-isolated-tests
      MINIO_ENDPOINT: http://127.0.0.1:9090
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
      s3:
        image: adobe/s3mock:5.2.2
        ports:
          - 9090:9090
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for isolated S3
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9090/favicon.ico > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Compile and run existing backend verification
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build production assets
        run: npm run build

  desktop:
    name: Desktop distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build independent desktop JAR
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -Pdesktop package
      - name: Verify desktop excludes server storage dependencies
        run: |
          python3 - <<'PY'
          import re
          from zipfile import ZipFile
          with ZipFile('backend/target/desktop/coffer-backend-0.0.1-SNAPSHOT.jar') as jar:
              names = jar.namelist()
          forbidden = re.compile(r'^BOOT-INF/lib/minio-|com/coffer/(service/MinioStorageService|config/(MinioConfig|BucketInitializer|MinioStorageHealthIndicator|ServerStorageProbe))')
          assert not any(forbidden.search(name) for name in names), 'Server storage dependency in desktop JAR'
          assert 'BOOT-INF/classes/com/coffer/desktop/DesktopEnvironmentPostProcessor.class' in names
          assert 'BOOT-INF/classes/com/coffer/memory/DatabaseChatMemoryStore.class' in names
          print('Desktop distribution verified')
          PY

  windows-installer:
    name: Windows desktop installer build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install locked frontend dependencies
        shell: pwsh
        run: |
          npm.cmd ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked shell dependencies
        shell: pwsh
        run: |
          npm.cmd ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shell security and binary preparation regression tests
        shell: pwsh
        run: |
          npm.cmd test --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare locked Electron Windows x64 binary
        shell: pwsh
        run: |
          node.exe desktop/scripts/prepare-electron.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and checksum self-contained Windows installer
        shell: pwsh
        run: |
          scripts/build-desktop.ps1 -MavenPath (Get-Command mvn.cmd).Source -JavaPath "$env:JAVA_HOME\bin\java.exe"
      - name: Verify installer and bundled resource identity
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          $installer = "desktop/dist/Coffer-$($package.version)-windows-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Expected Windows installer missing' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "$hash  $(Split-Path $installer -Leaf)"
          if (-not ((Get-Content desktop/dist/SHA256SUMS.txt) -contains $expected)) { throw 'Installer checksum does not match release manifest' }
          node.exe -e "const p=require('node:path'); const m=require('./desktop/src/resources.cjs').verifyResources(p.resolve('desktop/dist/win-unpacked/resources/coffer')); if(m.version!==require('./desktop/package.json').version)throw Error('Bundled application version mismatch'); console.log('Bundled release '+m.version+', schema V'+m.schemaVersion+', resources '+m.files.length)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Installer SHA-256: $hash"
          Write-Output "Authenticode: $((Get-AuthenticodeSignature -LiteralPath $installer).Status)"
