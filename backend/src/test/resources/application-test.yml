spring:
  datasource:
    url: jdbc:h2:mem:coffer_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
